name: Update GitHub Stats

on:
  schedule:
    # 每天 03:17 UTC = 北京时间 11:17，和贪吃蛇错开
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    # 改了脚本或本文件时立刻重算，不用等第二天
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/gen-stats.mjs"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/gen-stats.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          if git diff --staged --quiet; then
            echo "卡片无变化，跳过提交"
          else
            git commit -m "chore(stats): 更新 GitHub 数据卡片"
            git push
          fi
